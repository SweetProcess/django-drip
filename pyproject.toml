[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "django-drip"
dynamic = ["version"]
description = "Simple drip campaigns for Django."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Bryan Helmig", email = "bryan@zapier.com"}]
dependencies = ["Django>=5.1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/SweetProcess/django-drip"
Issues = "https://github.com/SweetProcess/django-drip/issues"
Documentation = "https://github.com/SweetProcess/django-drip/blob/master/docs/index.rst"

[dependency-groups]
dev = ["ruff==0.14.14"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"drip/south_migrations/*.py" = ["F401", "F811"]
"scripts/check_package.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["credits", "drip"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "drip.__version__"}

[tool.setuptools.packages.find]
include = ["drip", "drip.*"]
namespaces = false

[tool.setuptools.package-data]
drip = ["templates/**/*.html"]
