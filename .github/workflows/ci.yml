name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  style:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install --group dev
      - name: Check formatting
        run: ruff format --check .
      - name: Check import order
        run: ruff check .

  tests:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        django: ["5.1", "5.2", "6.0", "6.1"]
        exclude:
          # Django 5.1 does not support Python 3.14.
          - python: "3.14"
            django: "5.1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and selected Django series
        run: python -m pip install -r requirements.txt "Django~=${{ matrix.django }}.0"
      - name: Run test suite
        run: python -Wa manage.py test --noinput

  packaging:
    name: Package and Git installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Check isolated artifact installations
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            package_env="$RUNNER_TEMP/$(basename "$artifact").venv"
            python -m venv "$package_env"
            "$package_env/bin/python" -m pip install --no-cache-dir "$artifact" "Django~=5.1.0"
            (cd "$RUNNER_TEMP" && "$package_env/bin/python" "$GITHUB_WORKSPACE/scripts/check_package.py")
          done
      - name: Check installation from the checked-out Git commit
        run: |
          package_env="$RUNNER_TEMP/git-install.venv"
          python -m venv "$package_env"
          "$package_env/bin/python" -m pip install --no-cache-dir "git+file://${GITHUB_WORKSPACE}@${GITHUB_SHA}#egg=django-drip" "Django~=5.1.0"
          cd "$RUNNER_TEMP"
          "$package_env/bin/python" "$GITHUB_WORKSPACE/scripts/check_package.py"
